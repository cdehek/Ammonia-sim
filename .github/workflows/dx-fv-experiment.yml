name: Verify isolated DX finite-volume prototype
on:
  push:
    branches: [experimental/dx-fv-stage-3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Existing numerical regression suites
        run: npm test
      - name: Isolated three-section prototype against frozen references
        run: node experiments/dx-fv/test.cjs /tmp/dx-fv-results.json
      - name: Install independent thermodynamic reference pathway
        run: python -m pip install CoolProp==7.2.0 numpy==2.5.3 scipy==1.16.2
      - name: Regenerate direct-EOS and independent steady/transient references
        run: python experiments/dx-fv/generate_reference.py /tmp/dx-fv-reference.json
      - name: Prototype against freshly generated direct-EOS references
        run: DX_FV_REFERENCE_PATH=/tmp/dx-fv-reference.json node experiments/dx-fv/test.cjs /tmp/dx-fv-live-reference-results.json
      - name: Three-section adaptive temporal accuracy and conservation
        run: node experiments/dx-fv/time-test.cjs /tmp/dx-fv-time-results.json
      - name: Regenerate independent continuous-time direct-EOS reference
        run: python experiments/dx-fv/generate_time_reference.py /tmp/dx-fv-time-reference.json
      - name: Temporal accuracy against freshly generated Radau reference
        run: DX_FV_TIME_REFERENCE_PATH=/tmp/dx-fv-time-reference.json node experiments/dx-fv/time-test.cjs /tmp/dx-fv-time-live-results.json
      - name: Existing standalone source/build consistency
        run: |
          python tools/build.py /tmp/ammonia-fv-build
          git diff --exit-code -- index.html validation.json integration-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: three-section-dx-fv-verification
          path: |
            /tmp/dx-fv-results.json
            /tmp/dx-fv-reference.json
            /tmp/dx-fv-live-reference-results.json
            /tmp/dx-fv-time-results.json
            /tmp/dx-fv-time-reference.json
            /tmp/dx-fv-time-live-results.json
  browser-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install browser engines and system dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Existing Chromium application regressions
        run: npm run test:browser
      - name: Existing WebKit application regressions
        run: npm run test:webkit
      - name: Isolated Chromium and WebKit numerical execution and performance
        run: node experiments/dx-fv/browser-benchmark.cjs /tmp/dx-fv-browser-performance.json
      - uses: actions/upload-artifact@v4
        with:
          name: three-section-dx-temporal-browser-performance
          path: /tmp/dx-fv-browser-performance.json
      - name: Approved three/five/nine-section browser comparison
        run: node experiments/dx-fv/resolution-browser.cjs /tmp/dx-fv-resolution-browser.json
      - uses: actions/upload-artifact@v4
        with:
          name: three-five-nine-dx-browser
          path: /tmp/dx-fv-resolution-browser.json
      - name: Approved three/five-section browser comparison
        run: node experiments/dx-fv/spatial-browser.cjs /tmp/dx-fv-spatial-browser.json
      - uses: actions/upload-artifact@v4
        with:
          name: three-five-section-dx-spatial-browser
          path: /tmp/dx-fv-spatial-browser.json
  spatial-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Mesh contracts, temporal refinement and spatial comparison
        run: node experiments/dx-fv/spatial-test.cjs /tmp/dx-fv-spatial-results.json
      - name: Install independent thermodynamic reference pathway
        run: python -m pip install CoolProp==7.2.0 numpy==2.5.3 scipy==1.16.2
      - name: Regenerate independent three/five-section reference
        run: python experiments/dx-fv/generate_spatial_reference.py /tmp/dx-fv-spatial-reference.json
      - name: Mesh comparison against freshly generated direct-EOS reference
        run: DX_FV_SPATIAL_REFERENCE_PATH=/tmp/dx-fv-spatial-reference.json node experiments/dx-fv/spatial-test.cjs /tmp/dx-fv-spatial-live-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: three-five-section-dx-spatial-verification
          path: |
            /tmp/dx-fv-spatial-results.json
            /tmp/dx-fv-spatial-reference.json
            /tmp/dx-fv-spatial-live-results.json
  nine-section-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Three/five/nine contracts, time refinement and extended spatial comparison
        run: node experiments/dx-fv/resolution-test.cjs /tmp/dx-fv-resolution-results.json
      - name: Fresh-process numerical cost and memory
        run: node experiments/dx-fv/resolution-cost.cjs /tmp/dx-fv-resolution-cost.json
      - name: Warm-domain source sensitivity and independent frozen references
        run: node experiments/dx-fv/warm-domain-test.cjs /tmp/dx-fv-warm-domain.json
      - name: Install independent reference dependencies
        run: python -m pip install CoolProp==7.2.0 numpy==2.5.3 scipy==1.16.2
      - name: Regenerate independent three/five/nine steady, startup and heat-source references
        run: python experiments/dx-fv/generate_spatial_reference.py /tmp/dx-fv-resolution-reference.json 3,5,9
      - name: Replay qualified evidence against fresh independent references
        run: node experiments/dx-fv/resolution-reference-check.cjs /tmp/dx-fv-resolution-results.json /tmp/dx-fv-warm-domain.json /tmp/dx-fv-resolution-reference.json /tmp/dx-fv-resolution-live-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-five-nine-dx-resolution-verification
          path: |
            /tmp/dx-fv-resolution-results.json
            /tmp/dx-fv-resolution-results.json.failure.json
            /tmp/dx-fv-resolution-cost.json
            /tmp/dx-fv-warm-domain.json
            /tmp/dx-fv-resolution-reference.json
            /tmp/dx-fv-resolution-live-results.json
