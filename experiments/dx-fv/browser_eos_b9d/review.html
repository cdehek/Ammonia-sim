<!doctype html><meta charset="utf-8"><title>B9D source review harness</title><p>B9D independent source review and bounded paired science.</p>
<script>window.reviewRun=a=>new Promise((resolve,reject)=>{const w=new Worker('./review-worker.mjs',{type:'module'});w.onmessage=e=>{w.terminate();e.data.ok?resolve(e.data.result):reject(Error(e.data.error+'\n'+e.data.stack));};w.onerror=e=>{w.terminate();reject(Error(e.message));};w.postMessage(a);});</script>
